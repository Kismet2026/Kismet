AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kismet photo service Lambda scaffold.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  SharedApiId:
    Type: String
    Default: ''
  PhotosTableName:
    Type: String
    Default: kismet-photos-dev
  PhotosBucketName:
    Type: String
    Default: kismet-photos-dev
  PhotosCdnBaseUrl:
    Type: String
    Default: https://photos.kismet.dev
  EventBusName:
    Type: String
    Default: kismet-events

Conditions:
  HasSharedApiId: !Not [!Equals [!Ref SharedApiId, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active

Resources:
  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PhotosTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  PhotoServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kismet-photo-service-${EnvironmentName}
      Description: Handles photo upload and management routes for the Kismet photo service.
      CodeUri: .
      Handler: lambda_function.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTableName
        - S3CrudPolicy:
            BucketName: !Ref PhotosBucketName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
      Environment:
        Variables:
          PHOTOS_TABLE_NAME: !Ref PhotosTableName
          PHOTOS_BUCKET_NAME: !Ref PhotosBucketName
          PHOTOS_CDN_BASE_URL: !Ref PhotosCdnBaseUrl
          EVENT_BUS_NAME: !Ref EventBusName
      Events:
        UploadPhotoRoute:
          Type: Api
          Properties:
            Path: /photos/upload
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        PhotoDetailGetRoute:
          Type: Api
          Properties:
            Path: /photos/{identifier}
            Method: get
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        PhotoDetailDeleteRoute:
          Type: Api
          Properties:
            Path: /photos/{identifier}
            Method: delete
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        PhotoPrimaryRoute:
          Type: Api
          Properties:
            Path: /photos/{photoId}/primary
            Method: put
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]

Outputs:
  PhotoServiceFunctionName:
    Description: Photo service Lambda function name.
    Value: !Ref PhotoServiceFunction
  PhotoServiceFunctionArn:
    Description: Photo service Lambda function ARN.
    Value: !GetAtt PhotoServiceFunction.Arn
  PhotosTableArn:
    Description: Photo service DynamoDB table ARN.
    Value: !GetAtt PhotosTable.Arn


