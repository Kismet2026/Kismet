AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kismet email verification service Lambda scaffold.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  SharedApiId:
    Type: String
    Default: ''
  CognitoUserPoolId:
    Type: String
    Default: ''
  VerificationsTableName:
    Type: String
    Default: kismet-verifications-dev
  SesSourceEmail:
    Type: String
    Default: noreply@university.edu

Conditions:
  HasSharedApiId: !Not [!Equals [!Ref SharedApiId, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active

Resources:
  VerificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref VerificationsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  EmailVerificationServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kismet-email-verification-service-${EnvironmentName}
      Description: Handles verification code workflows for the Kismet email verification service.
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationsTableName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          VERIFICATIONS_TABLE_NAME: !Ref VerificationsTableName
          SES_SOURCE_EMAIL: !Ref SesSourceEmail
      Events:
        SendVerificationRoute:
          Type: Api
          Properties:
            Path: /verify/send
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        ConfirmVerificationRoute:
          Type: Api
          Properties:
            Path: /verify/confirm
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        VerificationStatusRoute:
          Type: Api
          Properties:
            Path: /verify/status
            Method: get
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]

Outputs:
  EmailVerificationServiceFunctionName:
    Description: Email verification service Lambda function name.
    Value: !Ref EmailVerificationServiceFunction
  EmailVerificationServiceFunctionArn:
    Description: Email verification service Lambda function ARN.
    Value: !GetAtt EmailVerificationServiceFunction.Arn
  VerificationsTableArn:
    Description: Email verification service DynamoDB table ARN.
    Value: !GetAtt VerificationsTable.Arn
