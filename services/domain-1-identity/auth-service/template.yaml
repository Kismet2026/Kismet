AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kismet auth service Lambda scaffold.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  SharedApiId:
    Type: String
    Default: ''
  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoAppClientId:
    Type: String
    Default: ''
  UsersTableName:
    Type: String
    Default: kismet-users-dev
  EventBusName:
    Type: String
    Default: kismet-events

Conditions:
  HasSharedApiId: !Not [!Equals [!Ref SharedApiId, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active

Resources:
  AuthServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kismet-auth-service-${EnvironmentName}
      Description: Handles account lifecycle routes for the Kismet auth service.
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTableName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBusName
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
          USERS_TABLE_NAME: !Ref UsersTableName
          EVENT_BUS_NAME: !Ref EventBusName
      Events:
        SignupRoute:
          Type: Api
          Properties:
            Path: /auth/signup
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        LoginRoute:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        RefreshRoute:
          Type: Api
          Properties:
            Path: /auth/refresh
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        LogoutRoute:
          Type: Api
          Properties:
            Path: /auth/logout
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]

Outputs:
  AuthServiceFunctionName:
    Description: Auth service Lambda function name.
    Value: !Ref AuthServiceFunction
  AuthServiceFunctionArn:
    Description: Auth service Lambda function ARN.
    Value: !GetAtt AuthServiceFunction.Arn
