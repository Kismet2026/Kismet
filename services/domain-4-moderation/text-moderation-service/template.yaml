AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kismet Text Moderation — Lambda, DynamoDB, API, EventBridge, Comprehend.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  SharedApiId:
    Type: String
    Default: ''
  TextModerationTableName:
    Type: String
    Default: kismet-text-moderation-dev
  EventBusName:
    Type: String
    Default: kismet-events

Conditions:
  HasSharedApiId: !Not [!Equals [!Ref SharedApiId, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 29
    MemorySize: 512
    Tracing: Active

Resources:
  TextModerationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TextModerationTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contentId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: N
      KeySchema:
        - AttributeName: contentId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TextModerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kismet-text-moderation-service-${EnvironmentName}
      Description: Text moderation — Comprehend, DynamoDB, content.flagged, message.sent.
      CodeUri: .
      Handler: lambda_function.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TextModerationTableName
        - Statement:
            - Effect: Allow
              Action:
                - comprehend:DetectToxicContent
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}
      Environment:
        Variables:
          TEXT_MODERATION_TABLE_NAME: !Ref TextModerationTableName
          EVENT_BUS_NAME: !Ref EventBusName
          TOXICITY_THRESHOLD: '0.65'
          CATEGORY_SCORE_FLOOR: '0.35'
          COMPREHEND_LANGUAGE: en
          ADMIN_GROUP_NAMES: admin
      Events:
        PostModerateText:
          Type: Api
          Properties:
            Path: /moderate/text
            Method: post
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        GetModerateHistory:
          Type: Api
          Properties:
            Path: /moderate/text/history
            Method: get
            RestApiId: !If [HasSharedApiId, !Ref SharedApiId, !Ref AWS::NoValue]
        MessageSentRule:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBusName
            Pattern:
              source:
                - kismet.message-service
              detail-type:
                - message.sent

Outputs:
  TextModerationFunctionName:
    Description: Lambda function name.
    Value: !Ref TextModerationFunction
  TextModerationFunctionArn:
    Description: Lambda function ARN.
    Value: !GetAtt TextModerationFunction.Arn
  TextModerationTableName:
    Description: DynamoDB table name.
    Value: !Ref TextModerationTableName
  TextModerationTableArn:
    Description: DynamoDB table ARN.
    Value: !GetAtt TextModerationTable.Arn
